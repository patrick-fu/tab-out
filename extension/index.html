<!-- ==========================================================================
     Tab Out UI 原型演示（AGY 设计）
     纯前端内存态交互原型 · 无真实 Chrome API 调用 · 无 localStorage 读写
     分支: p/patrick/ui-prototypes
     支持方案切换: ?variant=A (静谧工作台) | ?variant=B (纸上索引) | ?variant=C (快捷启动器)
     零远端依赖 · 系统字体 · 内联 SVG · 高信息密度
     ========================================================================== -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Out · 界面原型探索 (AGY Design)</title>
  <link rel="stylesheet" href="prototype/prototype.css">
</head>
<body>
  <!-- 主界面应用挂载点 -->
  <div id="prototypeAppRoot"></div>

  <!-- 全局轻量交互反馈 Toast -->
  <div id="prototypeToast" role="status" aria-live="polite"></div>

  <!-- 共享底部悬浮切换条 (仅 localhost / 127.0.0.1 / file 协议渲染) -->
  <div id="prototypeSwitcherRoot"></div>

  <!-- 原型应用主入口 (ES Module) -->
  <script type="module" src="prototype/main.js"></script>
</body>
</html>
